// Root build for the Lilyscan Java port (design-java.md).
// Shared configuration for every subproject; no production code lives here.

allprojects {
    group = 'org.lilyscan'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            // Java 25 (D13), matching Audiveris's own toolchain. Auto-provisioned
            // by the foojay resolver (settings.gradle) when not installed.
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
        mavenCentral()
        // Audiveris (linked in-process, D15) pulls non-free JAI from JBoss; our build
        // must resolve those transitive deps. Scoped to the javax.media group.
        maven {
            name = 'jboss-jai'
            url = 'https://repository.jboss.org/maven2'
            content { includeGroup 'javax.media' }
        }
    }

    dependencies {
        testImplementation rootProject.libs.junit.jupiter
        testRuntimeOnly rootProject.libs.junit.platform.launcher
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Parity tests read the shared fixtures and the Python-generated references
        // (tests/parity/, scripts/java_parity.py) from the repository root.
        systemProperty 'lilyscan.repoRoot', rootProject.projectDir.absolutePath
        inputs.dir(rootProject.file('tests/parity')).optional().withPropertyName('parity')
        // Opt-in full corpus sweep: -PparitySweep=/tmp/parity-sweep (scripts/java_parity.py --sweep).
        def sweep = project.findProperty('paritySweep')
        if (sweep) {
            systemProperty 'lilyscan.paritySweep', sweep
            outputs.upToDateWhen { false }
        }
        // Opt-in Stage 1 sweep: -PprepareSweep=/tmp/prepare-sweep (scripts/java_prepare_sweep.py).
        def prepareSweep = project.findProperty('prepareSweep')
        if (prepareSweep) {
            systemProperty 'lilyscan.prepareSweep', prepareSweep
            outputs.upToDateWhen { false }
        }
        // Opt-in combiner sweep: -PcombineSweep=/tmp/combine-sweep (scripts/java_combine_sweep.py).
        def combineSweep = project.findProperty('combineSweep')
        if (combineSweep) {
            systemProperty 'lilyscan.combineSweep', combineSweep
            outputs.upToDateWhen { false }
        }
        // Opt-in engine-run sweep: -PengineSweep=/tmp/engine-sweep (scripts/java_engine_sweep.py).
        def engineSweep = project.findProperty('engineSweep')
        if (engineSweep) {
            systemProperty 'lilyscan.engineSweep', engineSweep
            outputs.upToDateWhen { false }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all,-serial,-processing'
    }
}
