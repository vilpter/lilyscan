[project]
name = "lilyscan"
version = "0.1.0"
description = "Sheet music to editable LilyPond, built around the Audiveris OMR engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "pydantic>=2.8",
]

[project.optional-dependencies]
# MusicXML import/export (Stage 6 serializers, M1 baseline import).
musicxml = ["music21>=10.5"]
# CPU inference for project-owned models.
ml = ["onnxruntime>=1.18"]
# Image processing: synthetic degradation (eval) and the photo front-end (Stage 1).
vision = ["opencv-python-headless>=4.10", "numpy>=2.0"]
# Born-digital PDFs (Stage 4): PyMuPDF (AGPL-3.0, approved in D2) reads glyphs, text and
# vector lines; fontTools (MIT) reads glyph names from embedded music fonts.
vector = ["pymupdf>=1.24", "fonttools>=4.50"]

[project.scripts]
lilyscan = "lilyscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lilyscan"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The Audiveris submodule (the Java port's pinned engine) is upstream code, not ours (D6).
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["lilyscan"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lilyscan"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["music21.*", "onnxruntime.*", "torch.*", "fontTools.*"]
ignore_missing_imports = true

# music21 is only partly annotated; allow calling its untyped functions in the one
# module that builds scores with it.
[[tool.mypy.overrides]]
module = ["lilyscan.synth.generate"]
disallow_untyped_calls = false

# PyMuPDF's Document constructor is unannotated.
[[tool.mypy.overrides]]
module = ["lilyscan.ingest.pdf", "lilyscan.ingest.book", "lilyscan.vector.extract"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "engine: requires the Audiveris binary",
    "lilypond: requires the lilypond binary",
]
