# Build the Lilyscan image from this checkout instead of pulling the published one.
#
#   git submodule update --init                       # the Audiveris source the build needs
#   LANG=C.UTF-8 ./gradlew :lilyscan-cli:shadowJar    # needs JDK 25
#   docker compose -f docker-compose.yml -f docker/compose.build.yml up -d --build
#
# The result is tagged lilyscan:local, so it never mixes with the published image.
services:
  lilyscan:
    build:
      context: .   # relative to docker-compose.yml (the project directory)
      dockerfile: docker/Dockerfile
    image: lilyscan:local
