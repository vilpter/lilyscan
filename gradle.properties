# UTF-8 everywhere: the Audiveris dependency graph contains class names with non-ASCII
# characters (e.g. jgrapht's SørensenIndexLinkPrediction), which Shadow fails to unzip under a
# C/POSIX locale. The CI workflow and the Docker build also set LANG=C.UTF-8 (sun.jnu.encoding
# follows the OS locale, so these JVM args are a belt-and-suspenders hint).
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
