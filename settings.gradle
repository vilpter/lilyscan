pluginManagement {
    repositories {
        // Google-hosted Maven Central mirror first (Central's shared-IP rate limiting
        // 429s cloud builds); Gradle Plugin Portal and Central as fallbacks.
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets the Java toolchain auto-provision JDK 25 (D13) when it is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

dependencyResolutionManagement {
    repositories {
        maven { url = 'https://maven-central.storage-download.googleapis.com/maven2' }
        mavenCentral()
    }
}

rootProject.name = 'lilyscan'

include 'lilyscan-core'
include 'lilyscan-engine'
include 'lilyscan-server'
include 'lilyscan-cli'
include 'lilyscan-eval'
include 'lilyscan-desktop'   // optional, secondary front end (D14)

// Audiveris is linked in-process (D15) as a composite build against the submodule
// third_party/audiveris, pinned to a commit of the owner's fork, vilpter/audiveris
// branch master: the 5.11.0 release plus the fixes offered upstream (D6;
// docs/upstream/audiveris/README.md). The explicit
// dependency substitution maps the coordinate lilyscan-engine depends on to
// Audiveris's :app project, so we need not track Audiveris's own group/version.
//
// NOTE: the Audiveris build has no Java toolchain of its own, so it compiles with
// the JVM that launches Gradle. That JVM must be Java 25 (D13) — in CI via
// actions/setup-java java-version 25; locally, launch ./gradlew under a JDK 25.
includeBuild('third_party/audiveris') {
    dependencySubstitution {
        substitute module('org.audiveris:audiveris-app') using project(':app')
    }
}
