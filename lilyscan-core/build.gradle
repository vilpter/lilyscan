// lilyscan-core — the whole pipeline, IR, generator, repair, QA, config, device.
// No Swing, no HTTP, no web dependencies (design-java.md §4).
plugins {
    // Shared test helpers (repo root, parity references) for every module's tests.
    id 'java-test-fixtures'
}

dependencies {
    api libs.jackson.databind
    api libs.slf4j.api
    implementation libs.pdfbox
    testFixturesApi libs.junit.jupiter
    testFixturesApi libs.jackson.databind
}
