# Pinned dependency versions for the Java port (design-java.md §9).
# Only the entries actually referenced by a module are resolved; the rest are
# declared here so later milestones (JM4+ CV/ML, JM9 desktop) can wire them in.
[versions]
# External engines (pinned, D5/D7)
audiveris = "5.11.0"   # plus Lilyscan's fixes: vilpter/audiveris master (the submodule pin), D6/D7
lilypond = "2.26.0"
# Core libraries
proxymusic = "4.0.3"
pdfbox = "3.0.6"
# JBIG2 decoder for PDFBox (Apache-2.0); the release Audiveris 5.11.0 uses
jbig2-imageio = "3.0.4"
jackson = "2.18.2"
slf4j = "2.0.16"
logback = "1.5.12"
# Audiveris API types our engine code touches (must match third_party/audiveris/app/build.gradle)
jgrapht = "1.5.2"
jaxb-api = "2.3.1"
# Server + store
javalin = "6.3.0"
sqlite = "3.47.1.0"
# CLI
picocli = "4.7.6"
# Desktop (optional, JM9)
flatlaf = "3.7.2"
rsyntaxtextarea = "3.6.0"
# SVG rendering for the engraved pane (MIT)
jsvg = "2.2.0"
# CV / ML (optional, JM5+; coordinates verified before first use)
bytedeco-opencv = "4.13.0-1.5.13"
bytedeco-openblas = "0.3.31-1.5.13"
onnxruntime = "1.20.0"
# Tests
junit = "5.11.3"
# Plugins
shadow = "9.6.1"

[libraries]
opencv = { module = "org.bytedeco:opencv", version.ref = "bytedeco-opencv" }
openblas = { module = "org.bytedeco:openblas", version.ref = "bytedeco-openblas" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
jbig2-imageio = { module = "org.apache.pdfbox:jbig2-imageio", version.ref = "jbig2-imageio" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jgrapht-core = { module = "org.jgrapht:jgrapht-core", version.ref = "jgrapht" }
jaxb-api = { module = "javax.xml.bind:jaxb-api", version.ref = "jaxb-api" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
rsyntaxtextarea = { module = "com.fifesoft:rsyntaxtextarea", version.ref = "rsyntaxtextarea" }
jsvg = { module = "com.github.weisj:jsvg", version.ref = "jsvg" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
