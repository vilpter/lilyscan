// lilyscan-eval — the evaluation harness (`lilyscan eval run | calibrate`) and the corpus builder
// (`lilyscan corpus build`, D21): generated pieces, real works, engraving, simulated scans/photos.
dependencies {
    api project(':lilyscan-core')
    api project(':lilyscan-engine')
    // The scan and photo simulation (the natives come with lilyscan-core).
    implementation(libs.opencv) {
        exclude group: 'org.bytedeco', module: 'numpy'
    }
}

dependencies {
    testImplementation testFixtures(project(':lilyscan-core'))
}

tasks.withType(Test).configureEach {
    // .omr projects are read with Audiveris in-process (as the engine module's tests do).
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'sun.java2d.uiScale', '1'
}
