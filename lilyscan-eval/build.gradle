// lilyscan-eval — the evaluation harness (`lilyscan eval run | calibrate`). Corpora are built by
// the Python `lilyscan corpus build` for now; a Java generator is a later, optional step (D21).
dependencies {
    api project(':lilyscan-core')
    api project(':lilyscan-engine')
}

dependencies {
    testImplementation testFixtures(project(':lilyscan-core'))
}

tasks.withType(Test).configureEach {
    // .omr projects are read with Audiveris in-process (as the engine module's tests do).
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'sun.java2d.uiScale', '1'
}
