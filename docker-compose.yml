# Lilyscan: sheet music in, editable LilyPond out. One container, nothing else to install.
#
# Start it (Docker with the Compose plugin; see docs/INSTALL.md for a step-by-step guide):
#   docker compose up -d
#   # then open http://<this machine's address>:8000/
#
# The image (ghcr.io/vilpter/lilyscan) carries everything: the server, Audiveris with its OCR
# engine, LilyPond, and the OCR models for English, Latin, German and French. Other OCR languages
# named in LILYSCAN_OCR_LANGUAGES are downloaded once at startup and kept in the tessdata-cache
# volume.
#
# Settings: put any of the variables below in a file named .env next to this one, e.g.
#   LILYSCAN_PORT=8080
#   LILYSCAN_TAG=0.1.0          # a released version instead of the latest build
#
# Lilyscan has no login: anyone who can reach the port can upload and see every job. Keep it on
# your home network or behind a VPN or a reverse proxy that asks for a password (docs/INSTALL.md).
#
# Building the image from source instead of pulling it: see docker/compose.build.yml.
services:
  lilyscan:
    image: ghcr.io/vilpter/lilyscan:${LILYSCAN_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${LILYSCAN_BIND:-0.0.0.0}:${LILYSCAN_PORT:-8000}:8000"
    environment:
      # OCR languages for lyrics and text (Tesseract codes joined with +).
      LILYSCAN_OCR_LANGUAGES: "${LILYSCAN_OCR_LANGUAGES:-eng+lat+deu+fra}"
      # Memory for each Audiveris run (the engine runs in its own JVM).
      AUDIVERIS_MAX_HEAP: "${AUDIVERIS_MAX_HEAP:-3G}"
      # Time an engine run may take: the larger of a minimum and an allowance per page.
      AUDIVERIS_TIMEOUT_S: "${AUDIVERIS_TIMEOUT_S:-900}"
      AUDIVERIS_TIMEOUT_PER_PAGE_S: "${AUDIVERIS_TIMEOUT_PER_PAGE_S:-240}"
      # Time one engine step may take on one sheet before Audiveris gives up on it.
      AUDIVERIS_STEP_TIMEOUT_S: "${AUDIVERIS_STEP_TIMEOUT_S:-300}"
    volumes:
      - lilyscan-data:/data
      # Extra OCR models (downloaded or custom *.traineddata) persist here.
      - tessdata-cache:/var/cache/lilyscan/tessdata

volumes:
  lilyscan-data:
  tessdata-cache:
