# Lilyscan: sheet music in, editable LilyPond out. One service, one image, no Redis.
#
# Build and start (needs JDK 25, Docker, the Audiveris submodule and a UTF-8 locale):
#   git submodule update --init
#   LANG=C.UTF-8 ./gradlew :lilyscan-cli:shadowJar
#   docker compose up -d --build
#   # then open http://localhost:8000/
#
# The image carries everything: the server, Audiveris (with its OCR engine), LilyPond and the
# OCR models for English, Latin, German and French. Other OCR languages listed in
# LILYSCAN_OCR_LANGUAGES are downloaded once at startup and kept in the tessdata-cache volume.
# Once CI publishes the image to ghcr.io, `docker compose pull && docker compose up -d` will
# skip the build.
services:
  lilyscan:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/vilpter/lilyscan:${LILYSCAN_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${LILYSCAN_PORT:-8000}:8000"
    environment:
      # OCR languages for lyrics and text (Tesseract codes joined with +).
      LILYSCAN_OCR_LANGUAGES: "${LILYSCAN_OCR_LANGUAGES:-eng+lat+deu+fra}"
      # Memory for each Audiveris run (the engine runs in its own JVM).
      AUDIVERIS_MAX_HEAP: "${AUDIVERIS_MAX_HEAP:-3G}"
      # Time an engine run may take: the larger of a minimum and an allowance per page.
      AUDIVERIS_TIMEOUT_S: "${AUDIVERIS_TIMEOUT_S:-900}"
      AUDIVERIS_TIMEOUT_PER_PAGE_S: "${AUDIVERIS_TIMEOUT_PER_PAGE_S:-240}"
      # Time one engine step may take on one sheet before Audiveris gives up on it.
      AUDIVERIS_STEP_TIMEOUT_S: "${AUDIVERIS_STEP_TIMEOUT_S:-300}"
    volumes:
      - lilyscan-data:/data
      # Extra OCR models (downloaded or custom *.traineddata) persist here.
      - tessdata-cache:/var/cache/lilyscan/tessdata

volumes:
  lilyscan-data:
  tessdata-cache:
