# CI for the Java port (design-java.md JM0). Runs alongside the Python ci.yml during the port.
name: java-ci

on:
  push:
    branches: [main, "jm*", "java-*"]
    paths:
      - "lilyscan-*/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "docker/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "lilyscan-*/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "docker/**"
      - ".github/workflows/java-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/audiveris (D15), wired in JM1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Fat jar + CLI smoke test
        run: |
          ./gradlew :lilyscan-cli:shadowJar --no-daemon
          java -jar lilyscan-cli/build/libs/lilyscan.jar versions
          java -jar lilyscan-cli/build/libs/lilyscan.jar selftest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f docker/Dockerfile -t lilyscan:ci .
      - name: Smoke-test the image (versions + bundled LilyPond)
        run: |
          docker run --rm --entrypoint java lilyscan:ci -jar /app/lilyscan.jar versions
          docker run --rm --entrypoint lilypond lilyscan:ci --version
