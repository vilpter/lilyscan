# CI for the Java port (design-java.md JM0). Runs alongside the Python ci.yml during the port.
name: java-ci

on:
  push:
    branches: [main, "jm*", "java-*"]
    paths:
      - "lilyscan-*/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "docker/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "lilyscan-*/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "docker/**"
      - ".github/workflows/java-ci.yml"

env:
  # Audiveris's dependency graph has non-ASCII class names; a UTF-8 locale is required
  # so Shadow can unzip them (sun.jnu.encoding follows the OS locale).
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/audiveris (D15), wired in JM1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: LilyPond (the version pinned in the Docker image)
        run: |
          v=$(sed -n 's/^ARG LILYPOND_VERSION=//p' docker/Dockerfile)
          curl -fsSL -o /tmp/lilypond.tar.gz \
            "https://gitlab.com/lilypond/lilypond/-/releases/v$v/downloads/lilypond-$v-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/lilypond.tar.gz -C /opt
          echo "LILYPOND_BIN=/opt/lilypond-$v/bin/lilypond" >> "$GITHUB_ENV"
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Fat jar + CLI smoke test
        run: |
          ./gradlew :lilyscan-cli:shadowJar --no-daemon
          java -jar lilyscan-cli/build/libs/lilyscan.jar versions
          java -jar lilyscan-cli/build/libs/lilyscan.jar selftest

  engine:
    # The real Audiveris, in-process in forked workers: transcription, OCR, the .omr reader.
    runs-on: ubuntu-latest
    env:
      TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: OCR models (pinned commit, checksum-verified, as in the Docker image)
        run: |
          mkdir -p "$TESSDATA_PREFIX" && cd "$TESSDATA_PREFIX"
          commit=$(sed -n 's/^ARG TESSDATA_COMMIT=//p' "$GITHUB_WORKSPACE/docker/Dockerfile")
          for lang in eng lat deu fra; do
            curl -fsSL -o "$lang.traineddata" \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata/$commit/$lang.traineddata"
          done
          sha256sum -c "$GITHUB_WORKSPACE/docker/tessdata.sha256"
      - name: Engine tests
        run: ./gradlew :lilyscan-engine:test --no-daemon

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/audiveris (D15)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the fat jar (Audiveris bundled)
        run: ./gradlew :lilyscan-cli:shadowJar --no-daemon
      - name: Build the server image
        run: docker build -f docker/Dockerfile -t lilyscan:ci .
      - name: Smoke-test the image (versions + bundled LilyPond)
        run: |
          docker run --rm --entrypoint java lilyscan:ci -jar /app/lilyscan.jar versions
          docker run --rm --entrypoint lilypond lilyscan:ci --version
      - name: End to end (upload a page, transcribe, review, download)
        run: docker/smoke-test.sh lilyscan:ci
