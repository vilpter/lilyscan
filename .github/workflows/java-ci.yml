# CI for Lilyscan: the server, the CLI and the desktop app. The parity tests compare against
# references the Python implementation generated (tests/parity; the Python code is at the tag
# python-reference).
name: java-ci

on:
  push:
    branches: [main, "jm*", "java-*", "retire-*"]
    paths:
      - "lilyscan-*/**"
      - "services/web/**"
      - "docker-compose.yml"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "docker/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    paths:
      - "lilyscan-*/**"
      - "services/web/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/java-ci.yml"
      - "settings.gradle"
      - "build.gradle"
      - "gradle/**"
      - "gradlew"
      - "docker/**"
      - ".github/workflows/java-ci.yml"

env:
  # Audiveris's dependency graph has non-ASCII class names; a UTF-8 locale is required
  # so Shadow can unzip them (sun.jnu.encoding follows the OS locale).
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/audiveris (D15), wired in JM1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: LilyPond (the version pinned in the Docker image)
        run: |
          v=$(sed -n 's/^ARG LILYPOND_VERSION=//p' docker/Dockerfile)
          curl -fsSL -o /tmp/lilypond.tar.gz \
            "https://gitlab.com/lilypond/lilypond/-/releases/v$v/downloads/lilypond-$v-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/lilypond.tar.gz -C /opt
          echo "LILYPOND_BIN=/opt/lilypond-$v/bin/lilypond" >> "$GITHUB_ENV"
      - name: Build and test (a virtual display for the desktop app's window test)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" ./gradlew build --no-daemon
      - name: Desktop app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: lilyscan-desktop/build/screenshots/
          if-no-files-found: ignore
      - name: Fat jar + CLI smoke test
        run: |
          ./gradlew :lilyscan-cli:shadowJar --no-daemon
          java -jar lilyscan-cli/build/libs/lilyscan.jar versions
          java -jar lilyscan-cli/build/libs/lilyscan.jar selftest

  # Non-blocking forward-compatibility check (D5): the LilyPond tests against the next release.
  lilypond-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LILYPOND_NEXT: "2.27.3"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # the build includes Audiveris
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Next LilyPond
        run: |
          curl -fsSL -o /tmp/ly.tgz "https://gitlab.com/lilypond/lilypond/-/releases/v${LILYPOND_NEXT}/downloads/lilypond-${LILYPOND_NEXT}-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/ly.tgz -C /opt
          echo "LILYPOND_BIN=/opt/lilypond-${LILYPOND_NEXT}/bin/lilypond" >> "$GITHUB_ENV"
      - name: LilyPond tests (the pin check is expected to differ)
        run: >
          ./gradlew :lilyscan-core:test --no-daemon -PlilypondNext
          --tests 'org.lilyscan.core.lilypond.*' --tests 'org.lilyscan.core.qa.*'
          --tests 'org.lilyscan.core.PipelineTest'

  engine:
    # The real Audiveris, in-process in forked workers: transcription, OCR, the .omr reader.
    runs-on: ubuntu-latest
    env:
      TESSDATA_PREFIX: ${{ github.workspace }}/tessdata
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: OCR models (pinned commit, checksum-verified, as in the Docker image)
        run: |
          mkdir -p "$TESSDATA_PREFIX" && cd "$TESSDATA_PREFIX"
          commit=$(sed -n 's/^ARG TESSDATA_COMMIT=//p' "$GITHUB_WORKSPACE/docker/Dockerfile")
          for lang in eng lat deu fra; do
            curl -fsSL -o "$lang.traineddata" \
              "https://raw.githubusercontent.com/tesseract-ocr/tessdata/$commit/$lang.traineddata"
          done
          sha256sum -c "$GITHUB_WORKSPACE/docker/tessdata.sha256"
      - name: Engine tests
        run: ./gradlew :lilyscan-engine:test --no-daemon

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # third_party/audiveris (D15)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the fat jar (Audiveris bundled)
        run: ./gradlew :lilyscan-cli:shadowJar --no-daemon
      - name: Build the server image
        run: docker build -f docker/Dockerfile -t lilyscan:ci .
      - name: Smoke-test the image (versions + bundled LilyPond)
        run: |
          docker run --rm --entrypoint java lilyscan:ci -jar /app/lilyscan.jar versions
          docker run --rm --entrypoint lilypond lilyscan:ci --version
      - name: End to end (upload a page, transcribe, review, download)
        run: docker/smoke-test.sh lilyscan:ci
      - name: Extra OCR languages are downloaded at startup
        run: |
          docker run --rm -e LILYSCAN_OCR_LANGUAGES=eng+ita --entrypoint /app/entrypoint.sh lilyscan:ci \
            sh -c 'test -s "$TESSDATA_PREFIX/ita.traineddata" && echo "ita model ready"'
