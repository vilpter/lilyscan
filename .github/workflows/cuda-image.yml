name: cuda-image

# The CUDA worker image is large and slow to build, so it runs on demand and weekly
# rather than on every push. CI runners have no GPU; this only builds and publishes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vilpter/lilyscan-worker

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Build CUDA worker
        run: docker build -f services/worker/Dockerfile --build-arg VARIANT=cuda -t "$IMAGE:cuda" .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: |
          set -eu
          docker tag "$IMAGE:cuda" "$IMAGE:cuda-sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:cuda"
          docker push "$IMAGE:cuda-sha-${GITHUB_SHA::12}"
